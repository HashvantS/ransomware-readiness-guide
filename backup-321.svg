<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" role="img" aria-label="3-2-1 backup rule: three copies, two media types, one offsite or offline">
<rect width="900" height="1000" fill="#f7f5ef"/>
<text x="50" y="80" font-family="Georgia, serif" font-size="56" fill="#14213d">The 3-2-1 backup rule</text>
<text x="50" y="115" font-family="Arial, sans-serif" font-size="20" fill="#1f8a70">Sunrise Family Clinic (fictional) · safe backup plan</text>
<g font-family="Arial, sans-serif" fill="#14213d">
<rect x="50" y="150" width="250" height="190" rx="14" fill="#fff" stroke="#e3e0d6"/>
<text x="75" y="260" font-family="Georgia, serif" font-size="100" fill="#1f8a70">3</text>
<text x="75" y="300" font-size="22" font-weight="700">Copies</text>
<text x="75" y="326" font-size="17">Original plus two backups</text>
<rect x="325" y="150" width="250" height="190" rx="14" fill="#fff" stroke="#e3e0d6"/>
<text x="350" y="260" font-family="Georgia, serif" font-size="100" fill="#1f8a70">2</text>
<text x="350" y="300" font-size="22" font-weight="700">Media types</text>
<text x="350" y="326" font-size="17">For example disk and cloud</text>
<rect x="600" y="150" width="250" height="190" rx="14" fill="#fff" stroke="#e3e0d6"/>
<text x="625" y="260" font-family="Georgia, serif" font-size="100" fill="#a8501a">1</text>
<text x="625" y="300" font-size="22" font-weight="700">Offsite or offline</text>
<text x="625" y="326" font-size="17">Out of attackers' reach</text>
<rect x="50" y="380" width="800" height="100" rx="14" fill="#14213d"/>
<text x="80" y="425" font-size="26" font-weight="700" fill="#f7f5ef">Copy 1: Live data</text>
<text x="80" y="458" font-size="20" fill="#f7f5ef">Patient records on the clinic file server</text>
<text x="450" y="520" font-size="24" text-anchor="middle">↓ daily automatic backup</text>
<rect x="50" y="540" width="800" height="100" rx="14" fill="#fff" stroke="#14213d" stroke-width="2"/>
<text x="80" y="585" font-size="26" font-weight="700">Copy 2: External disk, on site</text>
<text x="80" y="618" font-size="20">Media type 1. Attackers on the network can reach it.</text>
<text x="450" y="680" font-size="24" text-anchor="middle">↓ weekly copy</text>
<rect x="50" y="700" width="800" height="110" rx="14" fill="#e3f3ec" stroke="#1f8a70" stroke-width="2"/>
<text x="80" y="745" font-size="26" font-weight="700">Copy 3: Cloud or offline drive, offsite</text>
<text x="80" y="778" font-size="20">Media type 2. Unplugged or immutable, so it survives an attack.</text>
<rect x="50" y="840" width="800" height="110" rx="14" fill="#fbeadb" stroke="#a8501a" stroke-width="2"/>
<text x="80" y="882" font-size="24" font-weight="700">Monthly restore test</text>
<text x="80" y="915" font-size="19">1. Restore 3 files from Copy 3   2. Open and check them   3. Log date and result</text>
</g>
</svg>
